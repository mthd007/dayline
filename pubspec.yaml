name: dayline
description: A calm, dark-first calendar with flexible reminders, .ics import and an optional Iranian calendar.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Android notifications (scheduled) + Windows toasts
  flutter_local_notifications: ^22.3.1
  # time-zone database, used to read TZID values in .ics files
  timezone: ^0.11.0
  shared_preferences: ^2.5.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
